[project]
name = "urlabuse"
version = "2.0.0.dev0"
description = "API broker for URLs: send a URL, get the answers of every provider."
authors = [{name="CIRCL", email="info@circl.lu"}]
license = "AGPL-3.0-or-later"
repository = "https://github.com/CIRCL/url-abuse"
requires-python = ">=3.10,<3.15"
readme = "README.md"
dynamic = [ "dependencies" ]

[project.scripts]
start = "bin.start:main"
stop = "bin.stop:main"
shutdown = "bin.shutdown:main"
run_backend = "bin.run_backend:main"
start_website = "bin.start_website:main"

[tool.poetry]
packages = [
    { include = "urlabuse" },
    { include = "bin" },
    { include = "website" },
]

[tool.poetry.dependencies]
flask = "^3.1"
flask-restx = "^1.3"
gunicorn = {version = ">=23", extras = ["setproctitle"]}
redis = {version = "^5.3.0,<6.0", extras = ["hiredis"]}

[tool.poetry.group.dev.dependencies]
mypy = "*"
ruff = "*"
pytest = "*"
requests = "*"
types-requests = "*"
types-redis = "*"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 200
extend-exclude = ["client"]

[tool.ruff.lint]
select = ["E", "F", "W"]
