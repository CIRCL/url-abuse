<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · CIRCL URL Abuse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="site">
    <a class="brand" href="{{ url_for('index') }}">
      <img src="{{ url_for('static', filename='logo-urlabuse.png') }}" alt="CIRCL URL Abuse" width="559" height="160">
    </a>
    <nav class="site-nav">
      <a class="site-link" href="{{ url_for('doc') }}">API</a>
    <a class="org-logo" href="https://www.circl.lu/" target="_blank" rel="noopener">
      <picture>
        <source srcset="{{ url_for('static', filename='logo-circl-dark.png') }}" media="(prefers-color-scheme: dark)">
        <img src="{{ url_for('static', filename='logo-circl.png') }}" alt="CIRCL, Computer Incident Response Center Luxembourg" width="210" height="87">
      </picture>
    </a>
    </nav>
  </header>
  <main>
    <section class="lost">
      <p class="lost-code">Error {{ code }}</p>
      <h1>{{ title }}</h1>
      <p>{{ message }}</p>
      <div class="lost-actions">
        <a class="btn-primary" href="{{ url_for('index') }}">Check a URL</a>
        <a class="site-link" href="{{ url_for('doc') }}">API documentation</a>
      </div>
    </section>
  </main>
</body>
</html>
