{% extends 'layouts/base.html' %}

{% block title %}{{ title }} · {% endblock %}

{% block main %}
    <section class="lost">
      <p class="lost-code">Error {{ code }}</p>
      <h1>{{ title }}</h1>
      <p>{{ message }}</p>
      <div class="lost-actions">
        <a class="btn-primary" href="{{ url_for('index') }}">Check a URL</a>
        <a class="site-link" href="{{ url_for('api_page') }}">API documentation</a>
      </div>
    </section>
{% endblock %}
